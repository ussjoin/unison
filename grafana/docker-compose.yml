# Authkey should advertise tags: `funnel`

# To bring the tailscale funnel online:
# 1. docker compose up (no -d)
# 2. The tailscale container on first start will display a URL to join the
#    container to the tailnet. Open the URL and authenticate the container.
# 3. Disable key expiry for the container.
# 4. docker exec -ti tailscaled-grafana /bin/sh
# 5. In that session, run tailscale funnel -bg --https=443 http://localhost:3000
# 6. This will bring the funnel online and make it persistent. If you need to
#    debug the funnel, drop the -bg to put it in foreground mode.
services:
  grafana:
    env_file:
      - .env
    environment:
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "authentik"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:?Authentik OAuth2 Client ID required}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:?Authentik OAuth2 Client Secret required}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email entitlements"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.hippo-acoustic.ts.net/application/o/authorize/"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.hippo-acoustic.ts.net/application/o/token/"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.hippo-acoustic.ts.net/application/o/userinfo/"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "https://auth.hippo-acoustic.ts.net/application/o/grafana/end-session/"
      # Optionally map user entitlements to Grafana roles
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(entitlements[*], 'Grafana Admins') && 'Admin' || contains(entitlements[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
      # Required if Grafana is running behind a reverse proxy
      GF_SERVER_ROOT_URL: "https://grafana.hippo-acoustic.ts.net"

    image: grafana/grafana
    container_name: grafana
    hostname: 'grafana'
    restart: always
    user: '1000'
    volumes:
      - grafana-data:/var/lib/grafana
  tailscaled:
    image: tailscale/tailscale:latest
    container_name: tailscaled-grafana
    restart: always
    environment:
      - TS_STATE_DIR=/var/lib/tailscale/
      - TS_AUTHKEY=${TS_AUTHKEY:-bad_auth_key}
    volumes:
      - /dev/net/tun:/dev/net/tun
      - tailscale-data:/var/lib/tailscale
    network_mode: "container:grafana"
    depends_on:
      - grafana
volumes:
  grafana-data:
    name: "grafana_grafana-data"
  tailscale-data:
    name: "grafana_tailscale-data"

