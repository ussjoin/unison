# Continuwuity
# To bring the tailscale funnel online:
# 1. docker compose up (no -d)
# 2. The tailscale container on first start will display a URL to join the
#    container to the tailnet. Open the URL and authenticate the container.
# 3. Disable key expiry for the container.
# 4. docker exec -ti tailscaled-continuwuity /bin/sh
# 5. In that session, run tailscale funnel -bg --https=443 http://localhost:6167
# 6. This will bring the funnel online and make it persistent. If you need to
#    debug the funnel, drop the -bg to put it in foreground mode.

services:
  homeserver:
    image: forgejo.ellis.link/continuwuation/continuwuity:latest
    restart: always
    hostname: matrix
    container_name: matrix
    volumes:
      - ./continuwuity-data:/var/lib/continuwuity
      - ./continuwuity-config/continuwuity.toml:/etc/continuwuity.toml
    environment:
      CONTINUWUITY_SERVER_NAME: ussjoin.com
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_PORT: 6167
      CONTINUWUITY_MAX_REQUEST_SIZE: 20000000 # in bytes, ~20 MB
      CONTINUWUITY_ALLOW_REGISTRATION: 'false'
      #CONTINUWUITY_REGISTRATION_TOKEN: 'fill_in_a_random_reg_token' # A registration token is required when registration is allowed.
      #CONTINUWUITY_YES_I_AM_VERY_VERY_SURE_I_WANT_AN_OPEN_REGISTRATION_SERVER_PRONE_TO_ABUSE: 'true'
      CONTINUWUITY_ALLOW_FEDERATION: 'true'
      CONTINUWUITY_ALLOW_CHECK_FOR_UPDATES: 'true'
      CONTINUWUITY_TRUSTED_SERVERS: '["matrix.org"]'
      #CONTINUWUITY_LOG: warn,state_res=warn
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_CONFIG: '/etc/continuwuity.toml' # Uncomment if you mapped config toml above
  tailscaled:
    image: tailscale/tailscale:latest
    container_name: tailscaled-continuwuity
    restart: always
    environment:
      - TS_STATE_DIR=/var/lib/tailscale/
    volumes:
      - /dev/net/tun:/dev/net/tun
      - ./tailscale-data:/var/lib/tailscale
    network_mode: "container:matrix"
    depends_on:
      - homeserver 

