# To bring the tailscale funnel online:
# 1. docker compose up (no -d)
# 2. The tailscale container on first start will display a URL to join the
#    container to the tailnet. Open the URL and authenticate the container.
# 3. Disable key expiry for the container.
# 4. docker exec -ti tailscaled-authentik /bin/sh
# 5. In that session, run tailscale funnel -bg --https=443 http://localhost:9000
# 6. This will bring the funnel online and make it persistent. If you need to
#    debug the funnel, drop the -bg to put it in foreground mode.

services:
  postgresql:
    env_file:
    - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    volumes:
    - ./postgres-data:/var/lib/postgresql/data
  auth:
    hostname: "auth"
    container_name: "auth"
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
    - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.3}
    restart: unless-stopped
    shm_size: 512mb
    volumes:
    - ./authentik-data:/data
    - ./authentik-templates:/templates
  worker:
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
    - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.3}
    restart: unless-stopped
    shm_size: 512mb
    user: root
    volumes:
    - ./authentik-data:/data
    - ./authentik-certs:/certs
    - ./authentik-templates:/templates
  tailscaled:
    image: tailscale/tailscale:latest
    container_name: tailscaled-authentik
    restart: always
    environment:
      - TS_STATE_DIR=/var/lib/tailscale/
    volumes:
      - /dev/net/tun:/dev/net/tun
      - ./tailscale-data:/var/lib/tailscale
    network_mode: "container:auth"
    depends_on:
      - auth
